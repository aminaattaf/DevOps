name: Deploiement Page
on:
  push:
    branches: main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Connexion à Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
        
      - name: Construire l'image Docker
        # On utilise le nom de votre dépôt : devops 
        run: docker build -t ${{ secrets.DOCKER_USERNAME }}/devops .
        
      - name: Envoyer l'image sur Docker Hub
        run: docker push ${{ secrets.DOCKER_USERNAME }}/devops

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # NOUVELLE ÉTAPE : On se connecte pour avoir le droit de télécharger l'image privée
      - name: Connexion à Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin
        
      - name: Extraire le fichier HTML du conteneur
        run: |
          docker create --name temp-container ${{ secrets.DOCKER_USERNAME }}/devops
          docker cp temp-container:/usr/share/nginx/html/index.html ./index.html
          
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4