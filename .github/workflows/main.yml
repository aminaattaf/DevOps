name : Hello World

on:
  push:
    # pour indiquer que le action ne se fait que quadn push sur main
    branches: main

jobs:
  afficher-hello:
  # on demadne a github de nous préter une machine virtuel avec la dernière version de ubuntu
    runs-on: ubuntu-latest
    
    # les étapes qui sont effectué
    steps:
      # le nom lisible 
      - name: Dire bonjour
        # et laction qui est effectué
        run: echo "Hello World!"

  afficher-info:
    # on demadne a github de nous préter une machine virtuel avec la dernière version de ubuntu
    runs-on: ubuntu-latest
    
    # les étapes qui sont effectué
    steps:
      # afficher les infos nom, prenom, email
      - name: Afficher nom
        run: echo "Le nom ${{ env.NAME }}"

      - name: Afficher prenom
        run: echo "Le prenom ${{ env.SURNAME }}"

      - name: Afficher mail
        run: echo "Le'eamil ${{ env.EMAIL }}"

  script-python:
    # 2ème Job : Le script Python
    runs-on: ubuntu-latest
    
    steps:
      - name: Exécuter le script Python
        # L'option -c permet d'exécuter une commande Python directement
        run: python3 -c "print('Commit success !')"
