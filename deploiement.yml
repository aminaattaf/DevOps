apiVersion: apps/v1
kind: Deployment
metadata:
  name: hello-deployment
  namespace: mon-espace
spec:
  replicas: 3
  selector:
    matchLabels:
      app: hello-web
  template:
    metadata:
      labels:
        app: hello-web
    spec:
      containers:
      - name: hello-container
        image: aminachakira/devops:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 80